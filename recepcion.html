<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Recepción · Casa Amatista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#120a1e; --bg-1:#1b0f2e; --bg-2:#241540;
    --card:#1e1230; --card-occ:#2a1747;
    --line:rgba(255,255,255,.09); --line-occ:rgba(193,155,255,.35);
    --text:#f1eaf8; --muted:#a798c1; --dim:#6d5f88;
    --amethyst:#c19bff; --amethyst-2:#8a5cf0; --rose:#f0a6c8;
    --ok:#7ee0b8;
    --shadow:0 24px 60px -30px rgba(0,0,0,.8);
    --font-h:'Playfair Display',Georgia,serif;
    --font-b:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-b);
    color:var(--text);
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(138,92,240,.22), transparent 60%),
      radial-gradient(1000px 700px at 100% 0%, rgba(240,166,200,.12), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-0) 70%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ── Barra superior ─────────────────────────────────────────── */
  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:24px; flex-wrap:wrap;
    padding:clamp(26px,3.2vw,46px) clamp(20px,4vw,56px) 0;
  }
  .marca{display:flex; align-items:baseline; gap:14px}
  .marca h1{
    font-family:var(--font-h); font-weight:700;
    font-size:clamp(26px,3.4vw,46px); letter-spacing:.5px;
    background:linear-gradient(120deg, #fff, var(--amethyst) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .marca .sub{
    font-size:clamp(12px,1.2vw,17px); color:var(--muted);
    text-transform:uppercase; letter-spacing:3px;
  }
  .reloj{text-align:right; line-height:1}
  .reloj .hora{
    font-family:var(--font-h); font-weight:600;
    font-size:clamp(34px,5vw,68px); letter-spacing:1px; line-height:1.08;
    font-variant-numeric:tabular-nums; padding-top:4px;
  }
  .reloj .fecha{
    color:var(--muted); font-size:clamp(12px,1.4vw,19px);
    margin-top:6px;
  }

  /* ── Resumen ────────────────────────────────────────────────── */
  .resumen{
    padding:14px clamp(20px,4vw,56px) 0;
    display:flex; gap:22px; flex-wrap:wrap; align-items:center;
    color:var(--muted); font-size:clamp(13px,1.3vw,17px);
  }
  .resumen b{color:var(--text); font-weight:500}
  .pill{display:inline-flex; align-items:center; gap:8px}
  .dot{width:10px; height:10px; border-radius:50%}
  .dot.occ{background:var(--amethyst); box-shadow:0 0 10px var(--amethyst)}
  .dot.free{background:transparent; border:2px solid var(--ok)}

  /* ── Cuadrícula de salas ────────────────────────────────────── */
  main{
    padding:clamp(16px,2.4vw,34px) clamp(20px,4vw,56px) clamp(70px,8vw,110px);
    display:grid; gap:clamp(14px,1.6vw,26px);
    grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  }
  .sala{
    position:relative; border-radius:20px; overflow:hidden;
    background:var(--card); border:1px solid var(--line);
    padding:clamp(18px,2vw,30px);
    min-height:clamp(180px,20vw,240px);
    display:flex; flex-direction:column;
    box-shadow:var(--shadow);
    transition:transform .5s ease, background .5s ease, border-color .5s ease;
  }
  .sala::before{
    content:''; position:absolute; inset:0 0 auto 0; height:5px;
    background:var(--line);
  }
  .sala.ocupada{background:var(--card-occ); border-color:var(--line-occ)}
  .sala.ocupada::before{
    background:linear-gradient(90deg, var(--amethyst-2), var(--amethyst), var(--rose));
  }
  .sala.ocupada{box-shadow:var(--shadow), 0 0 40px -12px rgba(193,155,255,.4)}
  .sala.sincon{opacity:.6}

  .sala .nombre{
    font-family:var(--font-h); font-weight:600;
    font-size:clamp(20px,2vw,30px); letter-spacing:.4px;
    display:flex; align-items:center; gap:12px;
  }
  .estado-mini{
    font-size:clamp(11px,1vw,14px); letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); display:inline-flex; align-items:center; gap:8px;
    margin-left:auto;
  }
  .sala .cuerpo{margin-top:auto; padding-top:18px}
  .ocupante{
    font-family:var(--font-h);
    font-size:clamp(24px,2.8vw,40px); font-weight:600; line-height:1.1;
  }
  .sala.ocupada .ocupante{
    background:linear-gradient(120deg,#fff,var(--amethyst));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .libre-txt{
    font-family:var(--font-h); font-size:clamp(24px,2.8vw,40px);
    font-weight:500; color:var(--dim);
  }
  .detalle{margin-top:10px; color:var(--muted); font-size:clamp(13px,1.3vw,18px)}
  .detalle .strong{color:var(--text)}
  .sub{margin-top:6px; color:var(--dim); font-size:clamp(12px,1.15vw,16px)}
  .sub .nm{color:var(--muted)}

  /* ── Pie ────────────────────────────────────────────────────── */
  footer{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:12px clamp(20px,4vw,56px);
    font-size:clamp(11px,1.1vw,14px); color:var(--dim);
    background:linear-gradient(0deg, var(--bg-0), transparent);
  }
  footer .estado-con{display:inline-flex; align-items:center; gap:9px}
  .latido{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok)}
  .latido.cargando{background:var(--amethyst); box-shadow:0 0 8px var(--amethyst); animation:pulso 1s ease-in-out infinite}
  .latido.error{background:var(--rose); box-shadow:0 0 8px var(--rose)}
  @keyframes pulso{0%,100%{opacity:.35}50%{opacity:1}}
  .btn-salir{
    background:none; border:1px solid var(--line); color:var(--dim);
    padding:6px 14px; border-radius:999px; cursor:pointer; font-family:var(--font-b);
    font-size:inherit; transition:.2s;
  }
  .btn-salir:hover{color:var(--text); border-color:var(--muted)}

  /* ── Login ──────────────────────────────────────────────────── */
  #login{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card-login{
    width:min(420px,100%); background:var(--card); border:1px solid var(--line);
    border-radius:22px; padding:clamp(26px,4vw,42px); box-shadow:var(--shadow);
  }
  .card-login h2{font-family:var(--font-h); font-weight:600; font-size:28px; margin-bottom:6px}
  .card-login p.lead{color:var(--muted); margin-bottom:22px; font-size:15px}
  .campo{margin-bottom:14px}
  .campo label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; letter-spacing:.4px}
  .campo input{
    width:100%; background:#150d24; border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:13px 15px; font-family:var(--font-b); font-size:16px;
  }
  .campo input:focus{outline:none; border-color:var(--amethyst)}
  .btn{
    width:100%; border:none; border-radius:12px; padding:14px; cursor:pointer;
    font-family:var(--font-b); font-size:16px; font-weight:500; color:#1a0f2b;
    background:linear-gradient(120deg,var(--amethyst),var(--amethyst-2));
    transition:.2s; margin-top:6px;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.6; cursor:default}
  .link{
    display:block; text-align:center; margin-top:16px; color:var(--muted);
    font-size:14px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .link:hover{color:var(--amethyst)}
  .msg{margin-top:14px; font-size:14px; min-height:20px}
  .msg.err{color:var(--rose)}
  .msg.ok{color:var(--ok)}
  [hidden]{display:none!important}
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="login" hidden>
  <div class="card-login">
    <h2>Recepción</h2>
    <p class="lead">Casa Amatista · pantalla de sala</p>

    <!-- paso: usuario + contraseña -->
    <div id="paso-pass">
      <div class="campo">
        <label for="r-user">Usuario</label>
        <input id="r-user" autocomplete="username" placeholder="nombre.apellido">
      </div>
      <div class="campo">
        <label for="r-pass">Contraseña</label>
        <input id="r-pass" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn" id="btn-entrar" onclick="doPassword()">Entrar</button>
      <span class="link" onclick="pedirCodigoFlujo()">Entrar con código al correo</span>
    </div>

    <!-- paso: código -->
    <div id="paso-codigo" hidden>
      <div class="campo">
        <label for="r-codigo">Código de 6 dígitos</label>
        <input id="r-codigo" inputmode="numeric" maxlength="6" placeholder="••••••">
      </div>
      <button class="btn" id="btn-codigo" onclick="doCodigo()">Confirmar código</button>
      <span class="link" onclick="volverAPass()">← Volver</span>
    </div>

    <div class="msg" id="login-msg"></div>
  </div>
</div>

<!-- ══════════════ TABLERO ══════════════ -->
<div id="tablero" hidden>
  <header>
    <div class="marca">
      <h1>Casa Amatista</h1>
      <span class="sub">Recepción</span>
    </div>
    <div class="reloj">
      <div class="hora" id="reloj-hora">--:--</div>
      <div class="fecha" id="reloj-fecha">—</div>
    </div>
  </header>

  <div class="resumen" id="resumen"></div>

  <main id="salas"></main>

  <footer>
    <span class="estado-con">
      <span class="latido" id="latido"></span>
      <span id="estado-txt">Conectando…</span>
    </span>
    <button class="btn-salir" onclick="salir()">Salir</button>
  </footer>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  Casa Amatista — Pantalla de recepción
//  Muestra, en tiempo real, qué psicólogo está en cada consultorio
//  según el calendario. Se apoya en el mismo backend y la misma
//  sesión (token) que la app; si ya entraste en la app en esta
//  computadora, la pantalla entra sola.
// ══════════════════════════════════════════════════════════════
const SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbzRIO6Yw8VIBgDKryr3T3b4tW8QjtN57W-Bt7a3-DVG8OkqLO9gTL8VBmOB3eY7JsvS/exec';
const SESSION_KEY = 'amatista_session';   // mismo que la app → comparten sesión
const REFRESCO_MS = 45000;                // el tablero se actualiza cada 45 s
const TIMEOUT_MS  = 30000;

// ── Sesión (compartida con la app) ────────────────────────────
function getSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(_){ return null; } }
function saveSession(d){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(d)); }catch(_){ } }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(_){ } }

// ── Llamada al backend (fetch, con JSONP de respaldo) ─────────
async function backend(url){
  const s = getSession();
  if(s && s.token && url.indexOf('token=')<0) url += '&token=' + encodeURIComponent(s.token);
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), TIMEOUT_MS);
    const r = await fetch(url, {method:'GET', credentials:'omit', redirect:'follow', signal:ctrl.signal});
    clearTimeout(t);
    if(r.ok){
      const txt = await r.text();
      try{ return JSON.parse(txt); }catch(_){ }
    }
  }catch(_){ }
  return jsonp(url);
}
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(()=>{ cleanup(); reject(new Error('Timeout')); }, TIMEOUT_MS);
    function cleanup(){ delete window[cb]; if(s.parentNode) document.head.removeChild(s); clearTimeout(t); }
    window[cb] = d => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error('Script error')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}

// ══════════════════════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════════════════════
function elem(id){ return document.getElementById(id); }
function loginMsg(t, clase){ const m = elem('login-msg'); m.textContent = t||''; m.className = 'msg ' + (clase||''); }

function mostrarLogin(){
  elem('tablero').hidden = true;
  elem('login').hidden = false;
  volverAPass();
  setTimeout(()=>elem('r-user').focus(), 100);
}
function volverAPass(){ elem('paso-codigo').hidden = true; elem('paso-pass').hidden = false; loginMsg(''); }

async function doPassword(){
  const u = elem('r-user').value.trim().toLowerCase();
  const p = elem('r-pass').value;
  if(!u || !p){ loginMsg('Escribe tu usuario y tu contraseña.', 'err'); return; }
  const btn = elem('btn-entrar'); btn.disabled = true; loginMsg('Entrando…');
  try{
    const d = await backend(`${SCRIPT_URL}?accion=loginPassword&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
    if(d && d.ok && d.token){ entrarConSesion(d); return; }
    if(d && d.error==='sin_password'){
      loginMsg('Aún no tienes contraseña. Te enviamos un código al correo…', 'ok');
      pedirCodigoFlujo();
    } else {
      loginMsg((d && d.mensaje) || 'No se pudo entrar.', 'err');
    }
  }catch(e){ loginMsg('No se pudo conectar. Revisa el internet e inténtalo de nuevo.', 'err'); }
  finally{ btn.disabled = false; }
}

async function pedirCodigoFlujo(){
  const u = elem('r-user').value.trim().toLowerCase();
  if(!u){ loginMsg('Primero escribe tu usuario.', 'err'); volverAPass(); return; }
  loginMsg('Enviando código…');
  try{
    const d = await backend(`${SCRIPT_URL}?accion=pedirCodigo&username=${encodeURIComponent(u)}`);
    if(d && d.ok && d.sinCorreo){
      // Periodo de gracia: sin correo registrado, entra directo
      const s = await backend(`${SCRIPT_URL}?accion=login&username=${encodeURIComponent(u)}`);
      if(s && s.ok && s.token){ entrarConSesion(s); return; }
      loginMsg((s && s.mensaje) || 'No se pudo entrar.', 'err'); return;
    }
    if(d && d.ok){
      elem('paso-pass').hidden = true; elem('paso-codigo').hidden = false;
      elem('r-codigo').dataset.user = u;
      loginMsg('Te enviamos un código a ' + (d.enviadoA || 'tu correo') + '.', 'ok');
      setTimeout(()=>elem('r-codigo').focus(), 100);
    } else {
      loginMsg((d && (d.mensaje||d.error)) || 'No se pudo enviar el código.', 'err');
    }
  }catch(e){ loginMsg('No se pudo conectar.', 'err'); }
}

async function doCodigo(){
  const u = elem('r-codigo').dataset.user || elem('r-user').value.trim().toLowerCase();
  const c = elem('r-codigo').value.trim();
  if(c.length < 6){ loginMsg('El código son 6 dígitos.', 'err'); return; }
  const btn = elem('btn-codigo'); btn.disabled = true; loginMsg('Verificando…');
  try{
    const d = await backend(`${SCRIPT_URL}?accion=verificarCodigo&username=${encodeURIComponent(u)}&codigo=${encodeURIComponent(c)}`);
    if(d && d.ok && d.token){ entrarConSesion(d); return; }
    loginMsg((d && d.mensaje) || 'Código incorrecto.', 'err');
  }catch(e){ loginMsg('No se pudo conectar.', 'err'); }
  finally{ btn.disabled = false; }
}

function entrarConSesion(d){
  saveSession({ token:d.token, username:d.username, nombreCompleto:d.nombreCompleto, rol:d.rol||'psicologo' });
  loginMsg('');
  iniciarTablero();
}

function salir(){
  const s = getSession();
  if(s && s.token) backend(`${SCRIPT_URL}?accion=cerrarSesion&token=${encodeURIComponent(s.token)}`).catch(()=>{});
  clearSession();
  detenerRefresco();
  mostrarLogin();
}

// La opción "Entrar con código" del paso 1 dispara el envío del código:
document.addEventListener('DOMContentLoaded', ()=>{
  // enganchar Enter en los campos
  const u = elem('r-user'), p = elem('r-pass'), c = elem('r-codigo');
  if(p) p.addEventListener('keydown', e=>{ if(e.key==='Enter') doPassword(); });
  if(u) u.addEventListener('keydown', e=>{ if(e.key==='Enter') elem('r-pass').focus(); });
  if(c) c.addEventListener('keydown', e=>{ if(e.key==='Enter') doCodigo(); });
});

// ══════════════════════════════════════════════════════════════
//  TABLERO
// ══════════════════════════════════════════════════════════════
let timerRefresco = null;

function iniciarTablero(){
  elem('login').hidden = true;
  elem('tablero').hidden = false;
  tick();                       // reloj inmediato
  cargarTablero();              // datos inmediatos
  detenerRefresco();
  timerRefresco = setInterval(cargarTablero, REFRESCO_MS);
}
function detenerRefresco(){ if(timerRefresco){ clearInterval(timerRefresco); timerRefresco = null; } }

// Reloj y fecha (en español), refresco cada segundo
function tick(){
  const ahora = new Date();
  elem('reloj-hora').textContent =
    ahora.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', hour12:false});
  try{
    let f = new Intl.DateTimeFormat('es-MX', {weekday:'long', day:'numeric', month:'long'}).format(ahora);
    elem('reloj-fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);
  }catch(_){ elem('reloj-fecha').textContent = ahora.toLocaleDateString(); }
}
setInterval(()=>{ if(!elem('tablero').hidden) tick(); }, 1000);

function fijarEstado(clase, texto){
  const l = elem('latido'); l.className = 'latido' + (clase ? ' ' + clase : '');
  elem('estado-txt').textContent = texto;
}

async function cargarTablero(){
  fijarEstado('cargando', 'Actualizando…');
  try{
    const d = await backend(`${SCRIPT_URL}?accion=tableroRecepcion`);
    if(d && d.error === 'no_autorizado'){ clearSession(); detenerRefresco(); mostrarLogin(); return; }
    if(!d || !d.ok || !Array.isArray(d.salas)){ fijarEstado('error', 'No se pudo cargar. Reintentando…'); return; }
    render(d.salas);
    const hh = new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    fijarEstado('', 'Actualizado a las ' + hh + ' · se actualiza solo cada 45 s');
  }catch(e){
    fijarEstado('error', 'Sin conexión. Reintentando…');
  }
}

function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(salas){
  let ocup = 0, libres = 0;
  const html = salas.map(s=>{
    if(s.ok === false){
      return `<div class="sala sincon">
        <div class="nombre">${esc(s.nombre)}
          <span class="estado-mini">sin conexión</span></div>
        <div class="cuerpo"><div class="libre-txt">—</div>
          <div class="sub">No se pudo leer este calendario.</div></div>
      </div>`;
    }
    if(s.actual){
      ocup++;
      const luego = s.siguiente
        ? `<div class="sub">Luego: <span class="nm">${esc(s.siguiente.nombre)}</span> · ${esc(s.siguiente.inicio)}</div>`
        : `<div class="sub">Sin más citas hoy</div>`;
      return `<div class="sala ocupada">
        <div class="nombre">${esc(s.nombre)}
          <span class="estado-mini"><span class="dot occ"></span>En sesión</span></div>
        <div class="cuerpo">
          <div class="ocupante">${esc(s.actual.nombre)}</div>
          <div class="detalle">Hasta las <span class="strong">${esc(s.actual.fin)}</span></div>
          ${luego}
        </div>
      </div>`;
    }
    libres++;
    const prox = s.siguiente
      ? `<div class="detalle">Próxima: <span class="strong">${esc(s.siguiente.nombre)}</span> a las ${esc(s.siguiente.inicio)}</div>`
      : `<div class="sub">Sin más citas hoy</div>`;
    return `<div class="sala">
      <div class="nombre">${esc(s.nombre)}
        <span class="estado-mini"><span class="dot free"></span>Disponible</span></div>
      <div class="cuerpo">
        <div class="libre-txt">Libre</div>
        ${prox}
      </div>
    </div>`;
  }).join('');

  elem('salas').innerHTML = html;
  elem('resumen').innerHTML =
    `<span class="pill"><span class="dot occ"></span> <b>${ocup}</b>&nbsp;en sesión</span>` +
    `<span class="pill"><span class="dot free"></span> <b>${libres}</b>&nbsp;libre${libres===1?'':'s'}</span>`;
}

// Al volver a mostrar la pestaña, refresca de inmediato
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && !elem('tablero').hidden) cargarTablero();
});

// ══════════════════════════════════════════════════════════════
//  ARRANQUE
// ══════════════════════════════════════════════════════════════
(function arranque(){
  const s = getSession();
  if(s && s.token){ iniciarTablero(); }
  else { mostrarLogin(); }
})();
</script>
</body>
</html>
